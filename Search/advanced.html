<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche avancée Google</title>
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1751378639257-0aca1af0089b?q=80&w=1405&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }
    .top-links {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .container {
      background-color: rgba(0,0,0,0.6);
      padding: 20px;
      margin: 100px auto;
      width: 600px;
      border-radius: 8px;
    }
    .google-title {
      font-size: 48px;
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: none;
      outline: none;
    }
    .buttons {
      margin-top: 20px;
      text-align: center;
    }
    .blue-button {
      background-color: #4d90fe;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    .blue-button:hover {
      background-color: #357ae8;
    }
    a {
      color: white;
      text-decoration: none;
      margin-left: 10px;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-links">
    <a href="index.html">Recherche Google</a>
  </div>

  <div class="container">
    <div class="google-title">GOOGLE</div>

    <form action="https://www.google.com/search" method="get">
      <label>
        tous ces mots :
        <input type="text" name="as_q">
      </label>
      <label>
        ce mot ou cette expression exacte :
        <input type="text" name="as_epq">
      </label>
      <label>
        l’un de ces mots :
        <input type="text" name="as_oq">
      </label>
      <label>
        aucun de ces mots :
        <input type="text" name="as_eq">
      </label>
      <div class="buttons">
        <button type="submit" class="blue-button">Recherche avancée</button>
      </div>
    </form>
  </div>
</body>
</html>
