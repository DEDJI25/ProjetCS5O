<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche Google</title>
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1751378639257-0aca1af0089b?q=80&w=1405&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
      margin: 0;
      font-family: Arial, sans-serif;
      color: rgb(3, 3, 3);
      text-align: center;
    }
    .top-links {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .google-title {
      font-size: 64px;
      margin-top: 150px;
      font-weight: bold;
      color: white;
    }
    input[type="text"] {
      width: 400px;
      padding: 10px;
      border-radius: 24px;
      border: none;
      outline: none;
    }
    .buttons {
      margin-top: 20px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      background-color: #f8f9fa;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      border: 1px solid #0f2247;
    }
    a {
      color: white;
      text-decoration: none;
      margin-left: 10px;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-links">
    <a href="image.html">Recherche d'images</a> |
    <a href="advanced.html">Recherche avancée</a>
  </div>

  <div class="google-title">GOOGLE</div>

  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q">
    <div class="buttons">
      <button type="submit">Recherche Google</button>
      <button type="submit" formaction="https://www.google.com/search" name="btnI">J'ai de la chance</button>
    </div>
  </form>

</html>
